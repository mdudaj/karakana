id: power-platform-cli-service-principal-bootstrap
name: Power Platform CLI service-principal bootstrap
description: Ensure PAC admin guidance separates Entra auth, Dataverse self-elevation, Power Platform app registration, and application user role assignment.
suite: skills
risk_level: high
tags:
  - power-platform
  - pac
  - dataverse
  - service-principal
  - permissions
input:
  task: "Troubleshoot PAC CLI service-principal setup where device-code login succeeds, assign-user fails with missing prvCreateUser on systemuser, and service-principal auth later fails on Microsoft.BusinessAppPlatform admin environments."
  project: crdb-mel
  skill: power-platform-cli-admin
  task_type: troubleshooting
  prompt_file: skills/power-platform-cli-admin/SKILL.md
expectations:
  must_include:
    - "pac admin self-elevate"
    - "prvCreateUser"
    - "systemuser"
    - "Dataverse"
    - "Power Platform admin"
    - "application register"
    - "assign-user"
    - "application user"
    - "service principal"
    - "do not recreate"
    - "separate"
    - "tenant"
    - "environment"
    - "security role"
    - "secrets"
  forbidden_patterns:
    - "recreate the tenant first"
    - "paste the client secret"
    - "ignore the environment"
