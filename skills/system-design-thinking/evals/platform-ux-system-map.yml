id: system-design-thinking-platform-ux-system-map
name: System design thinking maps platform UX before slicing
description: Ensure the skill requires boundary, actors, structure, dynamics, leverage, design rules, delivery slices, and backfire risks for platform UX work.
suite: skills
risk_level: medium
tags: [skills, systems-thinking, ux, architecture]
input:
