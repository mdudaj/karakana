id: engineering-release-documentation-release-plan
name: release-plan instruction coverage
description: Deterministic reference coverage of a realistic authoring/review boundary;
  no model behavior claim.
suite: skills
risk_level: medium
tags:
- engineering-artifacts
- instruction-coverage
input:
  task: Draft a first-use release plan with no restore/monitoring evidence and no
    publication authority.
  skill: engineering-release-documentation
  task_type: documentation
  prompt_file: skills/engineering-release-documentation/references/release-plan.md
expectations:
  must_include:
  - Separate target date/forecast
  - Not run/Blocked/unconfirmed
  - Do not claim backup restoration
  - separate facts
  forbidden_patterns:
  - (?m)^git push
  - (?m)^.*curl .*api.github.com
