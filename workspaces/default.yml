name: default
description: Default Karakana workspace
version: 0.1.0
status: stable

defaults:
  root: "."
  require_existing_paths: false
  use_current_skillpack_if_missing: true

projects:
  - id: karakana
    display_name: Karakana Harness
    path: "."
    skillpack: karakana
    memory: ubongo/projects/karakana
    tags:
      - harness
      - self-improvement
    standard_commands:
      status:
        - "git status --short"
      validate:
        - "karakana skill validate-all"
        - "karakana eval run"
        - "pytest"

  - id: crdb-mel
    display_name: Sustainable Finance MEL Platform
    path: "../crdb-mel"
    skillpack: crdb-mel
    memory: ubongo/projects/crdb-mel
    tags:
      - power-platform
      - power-pages
      - dataverse
      - xlsform
      - ux
    standard_commands:
      status:
        - "git status --short"
      validate:
        - "karakana skill validate skills/power-pages-odk-webforms"
        - "karakana eval run --skill power-pages-odk-webforms"
