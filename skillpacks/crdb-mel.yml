name: crdb-mel
description: Sustainable Finance MEL Platform Power Pages and Dataverse delivery profile
version: 0.1.0
status: experimental
project:
  id: crdb-mel
  display_name: Sustainable Finance MEL Platform
  memory: ubongo/projects/crdb-mel
skills:
  required:
    - power-platform-canvas-apps
    - power-pages-odk-webforms
    - design-system-governance
    - material-3-ui
    - delivery-artifact-gate
    - pdf-submission-renderer
    - karakana-handoff
  optional:
    - next-milestone-decision
    - brainstorm-verbalized-sampling
    - system-design-thinking
    - requirements-elicitation
    - grill-with-docs
    - write-karakana-skill
    - power-platform-cli-admin
model_routes:
  planning:
    provider: openai_codex
    model: gpt-5.4-mini
    rationale: Sustainable Finance MEL Platform planning is Codex-only while Copilot/GitHub inference tokens are unavailable; use mini for bounded planning and escalate only for framework, workflow, or production risk.
  routine_code_implementation:
    provider: openai_codex
    model: gpt-5.4-mini
    rationale: Use routine implementation routing after requirements, skills, and memory are loaded.
protocols:
  default: requirements-change
  categories:
    assessment: assessment-review
    frontend: ux-change
    implementation: python-code-change
    requirements: requirements-change
    skill: skill-update
safety:
  blocked_paths:
    - .env
    - .env.*
    - secrets/**
  requires_approval_for:
    - production_sharepoint_write
    - permission_change
    - app_import_or_publish
    - destructive_list_change
tests:
  commands:
    - karakana skill validate skills/power-platform-canvas-apps
    - karakana skill validate skills/power-pages-odk-webforms
    - karakana eval run --skill power-platform-canvas-apps
conventions:
  notes:
    - Load Sustainable Finance MEL Platform memory before implementation.
    - Use one field per row by default on data-entry screens.
    - Treat Power Pages plus Dataverse as the active proof-of-concept architecture.
    - Treat Project as the general top-level concept; TACATDP monitoring is the first proof-of-concept use case.
    - Use `docs/tacatdp-prototype-slice-1/` as the bounded implementation scope for the first TACATDP prototype slice.
    - Treat fixed TACATDP screens as transitional but acceptable for prototype delivery; prefer a metadata-driven form runner for the long-term project-platform UX.
    - For the ODK-style proof-of-concept field UX, use the Power Pages hosted Vue/ODK Web Forms path.
    - Power Pages SPA work must use the same Dataverse environment as the Power Pages site and should call the Power Pages Web API `/_api` when relying on Power Pages authentication and table permissions.
    - For Power Pages Web API browser imports, do not recycle table-permission changes after verified `Append`/`Append To` and cache refresh still produce `90040106` on a lookup bind; use a documented no-bind MVP path or approved server-side Dataverse import path.
    - For private developer/non-production Power Pages sites, grant the CRDB/Microsoft Entra user Site visibility access before invitation redemption testing; this is separate from TACATDP Contact, Web Role, Table Permission, Invitation, and assignment records.
    - "User onboarding documentation must show two gates for private sites: first private-site access grant, then Power Pages invitation redemption and TACATDP assignment verification."
    - Review `schemas/dataverse/form-renderer-contract.json` before implementing or modifying the hosted form runtime.
    - Do not let the full multi-project platform vision block the TACATDP prototype; document shortcuts and revisit them before generalization.
    - Use governed controlled vocabularies for reusable controlled variables and choice/reference data.
    - Treat TACATDP `schemas/dataverse/` artifacts as review-only schema inputs until explicit Dataverse environment-write approval is given.
    - Use a dedicated TACATDP village reference table artifact for high-volume cascading village lookup instead of generic vocabulary terms.
    - Keep Dataverse filters delegation-safe for large reference data.
