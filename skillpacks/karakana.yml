name: karakana
description: Karakana self-improvement and safety workflow project profile
version: 0.1.0
status: stable
project:
  id: karakana
  display_name: Karakana
  memory: ubongo/projects/karakana
  contract: KARAKANA.md
skills:
  required:
    - delivery-artifact-gate
    - design-system-governance
    - karakana-self-improvement
    - github-pr-review
    - ci-failure-analysis
    - karakana-handoff
    - write-karakana-skill
  optional:
    - okf-promotion-agent
    - viewflow-material-ui
    - next-milestone-decision
    - brainstorm-verbalized-sampling
    - system-design-thinking
    - ux-skill-router
    - hcd-ui-ux-delivery-loop
    - material-hcd-interface
    - material-component-spec
    - design-token-system
    - visual-design-review
    - design-qa-playwright
    - ux-writing
    - viewflow-form-controls
    - accessibility-wcag-audit
    - interaction-state-design
    - requirements-elicitation
    - grill-with-docs
    - django-debugging
    - power-platform-canvas-apps
    - power-platform-cli-admin
model_routes:
  planning:
    provider: openai_codex
    model: gpt-5.4-mini
    rationale: Karakana planning is Codex-only while Copilot/GitHub inference tokens are unavailable; use mini unless escalation is justified.
  documentation:
    provider: openai_codex
    model: gpt-5.4-mini
  high_risk_code_review:
    provider: openai_codex
    model: gpt-5.6-sol
protocols:
  default: python-code-change
  categories:
    architecture: architecture-decision
    assessment: assessment-review
    frontend: ux-change
    implementation: python-code-change
    memory: memory-update
    migration: data-migration
    release: release-change
    requirements: requirements-change
    safety: safety-policy-change
    skill: skill-update
safety:
  high_risk_paths:
    - karakana/models/**
    - karakana/safety/**
    - karakana/patch/**
    - karakana/codex/**
    - karakana/actions/**
    - .github/workflows/**
  blocked_paths:
    - .env
    - .env.*
    - secrets/**
  requires_approval_for:
    - safety_policy_change
    - model_execution_change
    - patch_application_change
    - workflow_change
tests:
  commands:
    - pytest
  recommended_before_commit:
    - karakana skill validate-all
    - karakana eval run
conventions:
  notes:
    - Keep all automation dry-run by default unless explicit flags are used.
    - Add evals for governance or safety changes.
    - Preserve human review for model, Codex, patch, and GitHub write workflows.
