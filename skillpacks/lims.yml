name: lims
description: Django Viewflow laboratory workflow project profile
version: 0.1.0
status: stable
project:
  id: lims
  display_name: Labs/LIMS
  memory: ubongo/projects/lims
  contract: KARAKANA.md
skills:
  required:
    - viewflow-framework
    - django-debugging
    - github-pr-review
    - ci-failure-analysis
    - karakana-handoff
  optional:
    - next-milestone-decision
    - brainstorm-verbalized-sampling
    - requirements-elicitation
    - grill-with-docs
    - gepg-billing
    - write-karakana-skill
model_routes:
  planning:
    provider: openai_codex
    model: gpt-5.4-mini
  viewflow_process_state_change:
    provider: openai_codex
    model: gpt-5.6-sol
  framework_code_implementation:
    provider: openai_codex
    model: gpt-5.4
safety:
  high_risk_paths:
    - workflows/**
    - viewflow/**
    - lims/**
    - lab/**
    - samples/**
    - results/**
    - .github/workflows/**
  blocked_paths:
    - .env
    - .env.*
    - secrets/**
  requires_approval_for:
    - workflow_state_change
    - permission_change
    - database_migration
    - production_config_change
tests:
  commands:
    - ./scripts/local_preview.sh check
    - ./scripts/local_preview.sh test apps.users apps.shell apps.operations apps.runtime apps.specimens apps.storage apps.reference
    - ./scripts/local_preview.sh browser-test
  recommended_before_commit:
    - karakana eval run --skill viewflow-framework
conventions:
  notes:
    - Review Viewflow process state, assignment, permissions, and frontend behavior together.
    - Active workflow compatibility must be checked before changing flow state names.
    - Use Docker-backed local preview commands for verification; direct SQLite fallback is not the full test path.
    - Create or switch to a task branch before editing either the Karakana harness repo or the LIMS repo.
